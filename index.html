<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fa" />
    <script>
      // Set the theme before first paint to avoid a light flash in dark mode.
      // Keep in sync with src/features/theme/ThemeToggle.tsx.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("fieldnotes-theme");
        } catch (e) {}
        var dark =
          saved === "dark" ||
          (saved !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#0f1418");
      })();
    </script>
    <meta name="description" content="A focused space to study, one card at a time." />
    <title>Fieldnotes | Study session</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
